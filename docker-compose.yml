services:
  mongo:
    image: mongo:8
    container_name: inovagab-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - inovagab_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: InovaGAB.API/Dockerfile
    container_name: inovagab-api
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - MongoDb__DatabaseName=InovaGab
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=InovaGAB.API
      - Jwt__Audience=InovaGAB.App
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  inovagab_mongo_data:
